version: '3'

dotenv:
  - .env
  - .homepage.env

vars:
  STACK_SERVICES: pihole,transmission,joal,stirling,servarr,mealie,vaultwarden,jellyfin,jellyseerr,home-assistant,portainer,file-gator,n8n,wiki,homepage,gitea,gitea-runner

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Bootstrap Docker, Tailscale and the dockarr network on a fresh host
    dir: install
    cmds:
      - chmod +x docker.sh
      - chmod +x tailscale.sh
      - sh docker.sh
      - docker network create dockarr
      - sh joal-setup.sh

  setup-config:
    desc: Generate homepage and home-assistant config
    dir: config
    cmds:
      - sh homepage-setup.sh
      - sh home-assistant-setup.sh

  '*-up':
    vars:
      SERVICE: '{{index .MATCH 0}}'
    dir: 'services/{{.SERVICE}}'
    cmd: docker compose up -d

  '*-down':
    vars:
      SERVICE: '{{index .MATCH 0}}'
    dir: 'services/{{.SERVICE}}'
    cmd: docker compose down

  n8n-up:
    dir: services/n8n
    cmds:
      - docker compose build
      - docker compose up -d

  start:
    desc: Start every service in the dockarr stack
    cmds:
      - for: { var: STACK_SERVICES, split: ',' }
        task: '{{.ITEM}}-up'

  teardown:
    desc: Stop and remove every container on the host
    cmds:
      - docker ps -aq | xargs -r docker stop
      - docker ps -aq | xargs -r docker rm

# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/jellyseerr/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-jellyseerr
    hostname: jellyseerr
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/jellyseerr:/var/lib/tailscale
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    init: true
    network_mode: service:tailscale
    container_name: jellyseerr
    environment:
      - PUID=${PUID:?PUID is not set (see .env)}
      - PGID=${PGID:?PGID is not set (see .env)}
      - TZ=${TZ:?TZ is not set (see .env)}
      - PORT=5055
    volumes:
      - ${CONFIG}/jellyseerr:/app/config
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always
services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-prowlarr
    hostname: prowlarr
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/prowlarr:/var/lib/tailscale
  prowlarr:
    image: linuxserver/prowlarr:3.0.2
    container_name: prowlarr
    network_mode: service:tailscale
    volumes:
      - ${CONFIG}/prowlarr:/config
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always
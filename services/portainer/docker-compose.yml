# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/portainer/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-portainer
    hostname: portainer
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/portainer:/var/lib/tailscale
  portainer:
    image: portainer/portainer-ce:2.45.3
    network_mode: service:tailscale
    container_name: portainer
    environment:
      - TZ=${TZ:?TZ is not set (see .env)}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG}/portainer:/data
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always
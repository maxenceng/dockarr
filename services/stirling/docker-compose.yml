# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/stirlingpdf/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-stirling
    hostname: stirling
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/stirling:/var/lib/tailscale
  stirling:
    image: frooodle/s-pdf:3.3.0
    network_mode: service:tailscale
    container_name: stirlingpdf
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=fr_FR
    volumes:
      - ${CONFIG}/stirling:/configs
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.jar"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
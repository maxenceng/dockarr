# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/vaultwarden/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-vaultwarden
    hostname: vaultwarden
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/vaultwarden:/var/lib/tailscale
  vaultwarden:
    image: vaultwarden/server:1.37.5
    network_mode: service:tailscale
    container_name: vaultwarden
    environment:
      SIGNUPS_ALLOWED: "true"
    volumes:
      - ${CONFIG}/vaultwarden:/data
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always
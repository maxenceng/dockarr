services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-wiki
    hostname: wiki
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/wiki:/var/lib/tailscale
  wiki:
    image: requarks/wiki:2.5.317
    network_mode: service:tailscale
    container_name: wiki
    environment:
      - DB_TYPE=sqlite
      - DB_FILEPATH=/var/db.sqlite
    volumes:
      - ${CONFIG}/wiki:/var
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always
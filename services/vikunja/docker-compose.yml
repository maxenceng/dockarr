services:
  tailscale:
    image: tailscale/tailscale:v1.102.3
    container_name: tailscale-vikunja
    hostname: vikunja${SUFFIX}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}?ephemeral=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_EXTRA_ARGS=--advertise-tags=tag:container --reset
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/vikunja:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
  vikunja:
    image: vikunja/vikunja:2.5.0
    network_mode: service:tailscale
    container_name: vikunja
    environment:
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SERVICE_SECRET}
      - VIKUNJA_SERVICE_PUBLICURL=https://vikunja${SUFFIX}.${TS_DOMAIN}/
    volumes:
      - ${CONFIG}/vikunja/files:/app/vikunja/files
      - ${CONFIG}/vikunja/db:/db
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always

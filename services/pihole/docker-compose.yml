# /etc/systemd/resolved.conf -> DNSStubListener=no
# systemctl restart systemd-resolved
# netstat -tuln | grep :53 -> Nothing

# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/pihole/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-pihole
    hostname: pihole
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/pihole:/var/lib/tailscale
  pihole:
    image: pihole/pihole:2026.11.0
    network_mode: service:tailscale
    container_name: pihole
    environment:
      - TZ=${TZ:?TZ is not set (see .env)}
    volumes:
      - ${CONFIG}/etc-pihole:/etc/pihole
      - ${CONFIG}/etc-dnsmasq.d:/etc/dnsmasq.d
    # service_started, not service_healthy: pihole is the tailnet DNS, and newer tailscale
    # reports unhealthy while that DNS is unreachable, so waiting for healthy deadlocks.
    depends_on:
      tailscale:
        condition: service_started
    healthcheck:
      test: [ "CMD", "pgrep", "-f", "pihole-FTL" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
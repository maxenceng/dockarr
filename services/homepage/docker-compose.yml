# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/homepage/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-homepage
    hostname: homepage
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/homepage:/var/lib/tailscale
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    network_mode: service:tailscale
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
    volumes:
      - ${CONFIG}/homepage:/app/config
      - ${CONFIG}/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "next-server"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
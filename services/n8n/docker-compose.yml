services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-n8n
    hostname: n8n
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/n8n:/var/lib/tailscale
  n8n:
    image: n8nio/n8n:3.3.0
    network_mode: service:tailscale
    container_name: n8n
    environment:
      - TZ=Europe/London
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://n8n.${TS_DOMAIN}
      - N8N_EDITOR_BASE_URL=https://n8n.${TS_DOMAIN}
    volumes:
      - ${CONFIG}/n8n:/home/node/.n8n
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always
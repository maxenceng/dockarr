services:
  tailscale:
    image: tailscale/tailscale:v1.102.3
    container_name: tailscale-qdrant
    hostname: qdrant${SUFFIX}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}?ephemeral=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_EXTRA_ARGS=--advertise-tags=tag:container --reset
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/qdrant:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
  # Reachable over the tailnet (via serve.json below) rather than loopback-only: this
  # instance is driven from outside the stack -- Claude Code sessions read/write it
  # directly over HTTPS, there's no sibling container calling it locally. Qdrant has no
  # auth by default, so QDRANT_API_KEY gates every request once it's tailnet-reachable.
  qdrant:
    image: qdrant/qdrant:v1.19.0
    network_mode: service:tailscale
    container_name: qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - ${CONFIG}/qdrant:/qdrant/storage
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always

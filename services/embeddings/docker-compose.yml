services:
  tailscale:
    image: tailscale/tailscale:v1.102.3
    container_name: tailscale-embeddings
    hostname: embeddings${SUFFIX}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}?ephemeral=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_EXTRA_ARGS=--advertise-tags=tag:container --reset
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/embeddings:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
  # BAAI/bge-small-en-v1.5: ~130MB, 384-dim, CPU-only, no GPU needed. Embedding-only --
  # cannot generate text, so this is not "running a model" in the LLM-chat sense.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    network_mode: service:tailscale
    container_name: embeddings
    volumes:
      - ${CONFIG}/embeddings:/data
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always

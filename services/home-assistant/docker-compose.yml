# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/home-assistant/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-home-assistant
    hostname: home-assistant
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/home-assistant:/var/lib/tailscale
  home-assistant:
    image: linuxserver/homeassistant:2026.11.2
    network_mode: service:tailscale
    container_name: home-assistant
    privileged: true
    environment:
      - PUID=${PUID:?PUID is not set (see .env)}
      - PGID=${PGID:?PGID is not set (see .env)}
      - TZ=${TZ:?TZ is not set (see .env)}
    volumes:
      - ${CONFIG}/home-assistant:/config
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: "curl --fail http://localhost:8123/ || exit 1"
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
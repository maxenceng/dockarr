services:
  joal:
    image: anthonyraymond/joal:2.1.37
    container_name: joal
    network_mode: service:gluetun
    volumes:
      - ${CONFIG}/joal:/data
    command: ["--joal-conf=/data", "--spring.main.web-environment=true", "--server.port=1234", "--joal.ui.path.prefix=seed", "--joal.ui.secret-token=${JOAL_SECRET_TOKEN}"]
    restart: always
    depends_on:
      - gluetun
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun-joal
    ports:
      - "1234:1234/tcp"
      - "1234:1234/udp"
    environment:
      - VPN_SERVICE_PROVIDER=${GLUETUN_PROVIDER}
      - VPN_TYPE=${GLUETUN_TYPE}
      - OPENVPN_USER=${GLUETUN_USER}
      - OPENVPN_PASSWORD=${GLUETUN_PASSWORD}
      - TZ=Europe/Amsterdam
      - SERVER_COUNTRIES=${GLUETUN_COUNTRIES}
    volumes:
      - ${CONFIG}/gluetun-joal:/gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: always
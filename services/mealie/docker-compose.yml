# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/mealie/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-mealie
    hostname: mealie
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/mealie:/var/lib/tailscale
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0
    network_mode: service:tailscale
    container_name: mealie
    environment:
      ALLOW_SIGNUP: "false"
      PUID: ${PUID:?PUID is not set (see .env)}
      PGID: ${PGID:?PGID is not set (see .env)}
      TZ: ${TZ:?TZ is not set (see .env)}
    volumes:
      - ${CONFIG}/mealie:/app/data
    depends_on:
      tailscale:
        condition: service_healthy
    restart: always
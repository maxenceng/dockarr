# Source: https://github.com/2Tiny2Scale/ScaleTail/blob/main/services/jellyfin/docker-compose.yml

services:
  tailscale:
    extends:
      file: ../../common/tailscale.yml
      service: tailscale
    container_name: tailscale-jellyfin
    hostname: jellyfin
    volumes:
      - ./config:/config
      - ${CONFIG}/ts/state/jellyfin:/var/lib/tailscale
  jellyfin:
    image: linuxserver/jellyfin:12.4ubu2604-ls60
    network_mode: service:tailscale
    container_name: jellyfin
    environment:
      - PUID=${PUID:?PUID is not set (see .env)}
      - PGID=${PGID:?PGID is not set (see .env)}
      - TZ=${TZ:?TZ is not set (see .env)}
      - JELLYFIN_FFmpeg__probesize=50000000
      - JELLYFIN_FFmpeg__analyzeduration=50000000
    volumes:
      - ${CONFIG}/jellyfin:/config
      - ${DATA}/movies:/movies
      - ${DATA}/movies-anime:/movies-anime
      - ${DATA}/tv:/tv
      - ${DATA}/tv-anime:/tv-anime
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pgrep", "-f", "jellyfin" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always